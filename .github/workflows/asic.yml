name: asic
on:
  push:
    paths: ['asic_run.txt']
permissions:
  contents: write
jobs:
  flow:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install
        run: pip install librelane gdstk matplotlib
      - name: cache pdk
        uses: actions/cache@v4
        with:
          path: ~/.ciel
          key: ciel-sky130-v1
      - name: download pdk (with retries)
        run: |
          for i in 1 2 3 4 5 6; do
            if ciel enable --pdk-family sky130 --pdk-root $HOME/.ciel 8afc8346a57fe1ab7934ba5a6056ea8b43078e71; then
              echo "PDK ready"; break
            fi
            echo "PDK download failed (try $i), waiting 30s"; sleep 30
          done
          true
      - name: show config
        run: cat librelane_config.json
      - name: run flow
        run: script -qec "python3 -m librelane --dockerized --pdk-root $HOME/.ciel librelane_config.json" /dev/null
      - name: collect
        if: always()
        run: |
          mkdir -p results
          rm -f results/layout.jpg results/layout.svg.gz
          python3 - <<'PY'
          import glob, json, os, io, re, gzip
          ansi = re.compile(r"\x1b\[[0-9;?]*[A-Za-z]|\x1b\]8;[^\x1b]*\x1b\\")
          def clean(t):
              return ansi.sub("", t)
          runs = sorted(glob.glob("runs/*"), key=os.path.getmtime)
          out = ["# ASIC result", ""]
          if not runs:
              out.append("flow did not start, check the Actions log")
          else:
              r = runs[-1]
              out.append("run: " + os.path.basename(r))
              lint = []
              for lf in glob.glob(r + "/*lint*/*.log") + glob.glob(r + "/*/*lint*.log"):
                  for ln in clean(open(lf, errors="ignore").read()).splitlines():
                      if "%Error" in ln or "%Warning" in ln:
                          lint.append(ln.strip())
              if lint:
                  out.append("")
                  out.append("## Lint messages")
                  out.extend(lint[:30])
              mp = r + "/final/metrics.json"
              if os.path.exists(mp):
                  m = json.load(open(mp))
                  keys = ("area", "utilization", "timing__setup__ws", "timing__hold__ws",
                          "setup_vio", "hold_vio", "power__total", "drc", "lvs",
                          "instance__count", "wirelength")
                  out.append("")
                  out.append("## Metrics")
                  for k in sorted(m):
                      if any(s in k for s in keys):
                          out.append("%s = %s" % (k, m[k]))
              else:
                  out.append("")
                  out.append("no final metrics: the flow stopped early")
                  fl = r + "/flow.log"
                  if os.path.exists(fl):
                      out.append("")
                      out.append("## Last lines of flow.log")
                      out.extend(clean(open(fl, errors="ignore").read()).splitlines()[-40:])
              g = glob.glob(r + "/final/gds/*.gds")
              if g:
                  # 1) vector layout: sharp at any zoom, gzip-compressed SVG
                  try:
                      import gdstk
                      lib = gdstk.read_gds(g[0])
                      top = lib.top_level()[0]
                      polys = top.get_polygons()
                      (x0, y0), (x1, y1) = top.bounding_box()
                      S = 100  # 0.01 micron units
                      W = int(round((x1 - x0) * S))
                      H = int(round((y1 - y0) * S))
                      # (layer, datatype): (name, color), drawn bottom to top
                      LAYERS = [
                          ((64, 20), "nwell", "#5b7f3a"), ((65, 20), "diff", "#3fbf5a"),
                          ((65, 44), "tap", "#2f9e8f"), ((66, 20), "poly", "#ff4d5a"),
                          ((66, 44), "licon", "#ffffff"), ((67, 20), "li1", "#d9a441"),
                          ((67, 44), "mcon", "#f5f5f5"), ((68, 20), "met1", "#4c8dff"),
                          ((68, 44), "via", "#c8c8c8"), ((69, 20), "met2", "#ff4fd8"),
                          ((69, 44), "via2", "#d8d8d8"), ((70, 20), "met3", "#00e5ff"),
                          ((70, 44), "via3", "#e0e0e0"), ((71, 20), "met4", "#ff9f1c"),
                          ((71, 44), "via4", "#e8e8e8"), ((72, 20), "met5", "#b388ff")]
                      by = {}
                      for p in polys:
                          by.setdefault((p.layer, p.datatype), []).append(p.points)
                      def path(pts):
                          xs = ((pts[:, 0] - x0) * S).round().astype(int).tolist()
                          ys = ((y1 - pts[:, 1]) * S).round().astype(int).tolist()
                          d = ["M%d %d" % (xs[0], ys[0])]
                          for i in range(1, len(xs)):
                              d.append("l%d %d" % (xs[i] - xs[i - 1], ys[i] - ys[i - 1]))
                          d.append("z")
                          return "".join(d)
                      tiers = [set(), {"nwell", "tap"},
                               {"nwell", "tap", "diff", "poly", "licon", "li1", "mcon"}]
                      data = b""
                      for drop in tiers:
                          parts = ['<svg xmlns="http://www.w3.org/2000/svg" '
                                   'viewBox="0 0 %d %d" shape-rendering="crispEdges">' % (W, H)]
                          for key, name, col in LAYERS:
                              if name in drop or key not in by:
                                  continue
                              parts.append('<path fill="%s" fill-opacity="0.75" d="%s"/>'
                                           % (col, "".join(path(pt) for pt in by[key])))
                          parts.append("</svg>")
                          data = gzip.compress("".join(parts).encode(), 9)
                          if len(data) <= 1200000:
                              break
                      open("results/layout.svg.gz", "wb").write(data)
                      out.append("")
                      out.append("layout: %d x %d um, svg %d KB" % (x1 - x0, y1 - y0, len(data) // 1024))
                  except Exception as e:
                      out.append("layout svg failed: %s" % e)
                  # 2) fallback picture, used only if the SVG is missing
                  if not os.path.exists("results/layout.svg.gz"):
                      try:
                          import gdstk, matplotlib
                          matplotlib.use("Agg")
                          import matplotlib.pyplot as plt
                          from matplotlib.collections import PolyCollection
                          lib = gdstk.read_gds(g[0])
                          polys = lib.top_level()[0].get_polygons()
                          by = {}
                          for p in polys:
                              by.setdefault(p.layer, []).append(p.points)
                          fig = plt.figure(figsize=(12, 12), dpi=200)
                          ax = fig.add_axes([0, 0, 1, 1])
                          cols = plt.cm.tab20.colors
                          for l, pts in by.items():
                              ax.add_collection(PolyCollection(pts, facecolor=cols[l % 20],
                                                               alpha=0.6, linewidths=0))
                          ax.autoscale()
                          ax.set_aspect("equal")
                          ax.axis("off")
                          for q in (88, 80, 70, 60, 50, 40, 30, 20):
                              b = io.BytesIO()
                              fig.savefig(b, format="jpg", pil_kwargs={"quality": q})
                              if b.tell() < 450000:
                                  break
                          open("results/layout.jpg", "wb").write(b.getvalue())
                      except Exception as e:
                          out.append("layout image failed: %s" % e)
          open("results/summary.md", "w").write("\n".join(out) + "\n")
          PY
          cat results/summary.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asic-run
          path: runs/*/final
      - name: commit results
        if: always()
        run: |
          git config user.name "asic-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A results
          git commit -m "asic results" || true
          git pull --rebase origin main || true
          git push || true
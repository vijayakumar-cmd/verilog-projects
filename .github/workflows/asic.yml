name: asic
on:
  push:
    paths: ['asic_run.txt']
permissions:
  contents: write
jobs:
  flow:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install
        run: pip install librelane gdstk matplotlib
      - name: show config
        run: cat librelane_config.json
      - name: run flow
        run: script -qec "python3 -m librelane --dockerized --pdk-root $HOME/.ciel librelane_config.json" /dev/null
      - name: collect
        if: always()
        run: |
          mkdir -p results
          python3 - <<'PY'
          import glob, json, os, io, re
          ansi = re.compile(r"\x1b\[[0-9;?]*[A-Za-z]|\x1b\]8;[^\x1b]*\x1b\\")
          def clean(t):
              return ansi.sub("", t)
          runs = sorted(glob.glob("runs/*"), key=os.path.getmtime)
          out = ["# ASIC result", ""]
          if not runs:
              out.append("flow did not start, check the Actions log")
          else:
              r = runs[-1]
              out.append("run: " + os.path.basename(r))
              # lint messages (the real reason for 'Lint errors found')
              lint = []
              for lf in glob.glob(r + "/*lint*/*.log") + glob.glob(r + "/*/*lint*.log"):
                  for ln in clean(open(lf, errors="ignore").read()).splitlines():
                      if "%Error" in ln or "%Warning" in ln:
                          lint.append(ln.strip())
              if lint:
                  out.append("")
                  out.append("## Lint messages")
                  out.extend(lint[:30])
              mp = r + "/final/metrics.json"
              if os.path.exists(mp):
                  m = json.load(open(mp))
                  keys = ("area", "utilization", "timing__setup__ws", "timing__hold__ws",
                          "setup_vio", "hold_vio", "power__total", "drc", "lvs",
                          "instance__count", "wirelength")
                  out.append("")
                  out.append("## Metrics")
                  for k in sorted(m):
                      if any(s in k for s in keys):
                          out.append("%s = %s" % (k, m[k]))
              else:
                  out.append("")
                  out.append("no final metrics: the flow stopped early")
                  fl = r + "/flow.log"
                  if os.path.exists(fl):
                      out.append("")
                      out.append("## Last lines of flow.log")
                      out.extend(clean(open(fl, errors="ignore").read()).splitlines()[-40:])
              g = glob.glob(r + "/final/gds/*.gds")
              if g:
                  try:
                      import gdstk, matplotlib
                      matplotlib.use("Agg")
                      import matplotlib.pyplot as plt
                      from matplotlib.collections import PolyCollection
                      lib = gdstk.read_gds(g[0])
                      polys = lib.top_level()[0].get_polygons()
                      by = {}
                      for p in polys:
                          by.setdefault(p.layer, []).append(p.points)
                      fig, ax = plt.subplots(figsize=(8, 8), dpi=90)
                      cols = plt.cm.tab20.colors
                      for l, pts in by.items():
                          ax.add_collection(PolyCollection(pts, facecolor=cols[l % 20],
                                                           alpha=0.5, linewidths=0))
                      ax.autoscale()
                      ax.set_aspect("equal")
                      ax.axis("off")
                      for q in (70, 50, 35, 20):
                          b = io.BytesIO()
                          fig.savefig(b, format="jpg", pil_kwargs={"quality": q},
                                      bbox_inches="tight")
                          if b.tell() < 60000:
                              break
                      open("results/layout.jpg", "wb").write(b.getvalue())
                  except Exception as e:
                      out.append("layout image failed: %s" % e)
          open("results/summary.md", "w").write("\n".join(out) + "\n")
          PY
          cat results/summary.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asic-run
          path: runs/*/final
      - name: commit results
        if: always()
        run: |
          git config user.name "asic-bot"
          git config user.email "bot@users.noreply.github.com"
          git add results
          git commit -m "asic results" || true
          git pull --rebase origin main || true
          git push || true
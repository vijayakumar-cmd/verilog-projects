name: asic
on:
  push:
    paths: ['asic_run.txt']
permissions:
  contents: write
jobs:
  flow:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install
        run: pip install librelane gdstk matplotlib
      - name: cache pdk
        uses: actions/cache@v4
        with:
          path: ~/.ciel
          key: ciel-sky130-v1
      - name: download pdk (with retries)
        run: |
          for i in 1 2 3 4 5 6; do
            if ciel enable --pdk-family sky130 --pdk-root $HOME/.ciel 8afc8346a57fe1ab7934ba5a6056ea8b43078e71; then
              echo "PDK ready"; break
            fi
            echo "PDK download failed (try $i), waiting 30s"; sleep 30
          done
          true
      - name: show config
        run: cat librelane_config.json
      - name: run flow
        run: |
          set +e
          script -qec "python3 -m librelane --dockerized --pdk-root $HOME/.ciel librelane_config.json" /dev/null | tee flow_out.txt
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ] && { grep -qE "PDN-0185|IFP-0002|Insufficient width" flow_out.txt || grep -rqsE "PDN-0185|IFP-0002|Insufficient width" runs; }; then
            echo "design too small for its area or power grid, retrying with a 60 x 60 um die"
            python3 -c 'import json; c=json.load(open("librelane_config.json")); c["FP_SIZING"]="absolute"; c["DIE_AREA"]=[0,0,60,60]; json.dump(c, open("librelane_config.json","w"), indent=2)'
            cat librelane_config.json
            rm -rf runs
            script -qec "python3 -m librelane --dockerized --pdk-root $HOME/.ciel librelane_config.json" /dev/null
            rc=$?
          fi
          exit $rc
      - name: collect
        if: always()
        run: |
          mkdir -p results
          rm -f results/layout.jpg results/layout.svg.gz
          python3 - <<'PY'
          import glob, json, os, io, re, gzip
          ansi = re.compile(r"\x1b\[[0-9;?]*[A-Za-z]|\x1b\]8;[^\x1b]*\x1b\\")
          def clean(t):
              return ansi.sub("", t)
          runs = sorted(glob.glob("runs/*"), key=os.path.getmtime)
          out = ["# ASIC result", ""]
          if not runs:
              out.append("flow did not start, check the Actions log")
          else:
              r = runs[-1]
              out.append("run: " + os.path.basename(r))
              lint = []
              for lf in glob.glob(r + "/*lint*/*.log") + glob.glob(r + "/*/*lint*.log"):
                  for ln in clean(open(lf, errors="ignore").read()).splitlines():
                      if "%Error" in ln or "%Warning" in ln:
                          lint.append(ln.strip())
              if lint:
                  out.append("")
                  out.append("## Lint messages")
                  out.extend(lint[:30])
              mp = r + "/final/metrics.json"
              if os.path.exists(mp):
                  m = json.load(open(mp))
                  keys = ("area", "utilization", "timing__setup__ws", "timing__hold__ws",
                          "setup_vio", "hold_vio", "power__total", "drc", "lvs",
                          "instance__count", "wirelength")
                  out.append("")
                  out.append("## Metrics")
                  for k in sorted(m):
                      if any(s in k for s in keys):
                          out.append("%s = %s" % (k, m[k]))
              else:
                  out.append("")
                  out.append("no final metrics: the flow stopped early")
                  fl = r + "/flow.log"
                  if os.path.exists(fl):
                      out.append("")
                      out.append("## Last lines of flow.log")
                      out.extend(clean(open(fl, errors="ignore").read()).splitlines()[-40:])
              g = glob.glob(r + "/final/gds/*.gds")
              if g:
                  # 1) vector layout: sharp at any zoom, gzip-compressed SVG, KLayout-like look
                  try:
                      import gdstk
                      lib = gdstk.read_gds(g[0])
                      top = lib.top_level()[0]
                      polys = top.get_polygons()
                      (bx0, by0), (bx1, by1) = top.bounding_box()
                      x0, y0, x1, y1 = bx0, by0, bx1, by1
                      try:
                          bb = json.load(open(mp)).get("design__die__bbox", "")
                          v = [float(t) for t in str(bb).replace(",", " ").split()]
                          if len(v) == 4 and v[2] > v[0] and v[3] > v[1]:
                              x0, y0, x1, y1 = v
                      except Exception:
                          pass
                      pad = 0.03 * max(x1 - x0, y1 - y0)
                      ox, oy = x0 - pad, y1 + pad
                      S = 100  # 0.01 micron units
                      W = int(round((x1 - x0 + 2 * pad) * S))
                      H = int(round((y1 - y0 + 2 * pad) * S))
                      # ((layer, datatype), name, color, fill style), drawn bottom to top
                      LAYERS = [
                          ((64, 20), "nwell", "#8a9a5b", "solid"), ((65, 20), "diff", "#2ecc40", "dots"),
                          ((65, 44), "tap", "#1aa890", "dots"), ((66, 20), "poly", "#e63946", "diag"),
                          ((66, 44), "licon", "#ffffff", "solid"), ((67, 20), "li1", "#d97706", "anti"),
                          ((67, 44), "mcon", "#fff2a8", "solid"), ((68, 20), "met1", "#3b82f6", "horiz"),
                          ((68, 44), "via", "#9ec5ff", "solid"), ((69, 20), "met2", "#ff4fd8", "vert"),
                          ((69, 44), "via2", "#ffb3ec", "solid"), ((70, 20), "met3", "#22d3ee", "diag"),
                          ((70, 44), "via3", "#a5f3fc", "solid"), ((71, 20), "met4", "#facc15", "anti"),
                          ((71, 44), "via4", "#fff3a0", "solid"), ((72, 20), "met5", "#a78bfa", "cross")]
                      by = {}
                      for p in polys:
                          by.setdefault((p.layer, p.datatype), []).append(p.points)
                      def path(pts):
                          xs = ((pts[:, 0] - ox) * S).round().astype(int).tolist()
                          ys = ((oy - pts[:, 1]) * S).round().astype(int).tolist()
                          d = ["M%d %d" % (xs[0], ys[0])]
                          for i in range(1, len(xs)):
                              d.append("l%d %d" % (xs[i] - xs[i - 1], ys[i] - ys[i - 1]))
                          d.append("z")
                          return "".join(d)
                      def pattern(name, col, style):
                          rot = {"diag": 45, "anti": -45, "horiz": 90, "vert": 0, "cross": 0, "dots": 0}[style]
                          body = '<rect width="40" height="40" fill="%s" fill-opacity="0.30"/>' % col
                          if style == "dots":
                              body += '<circle cx="20" cy="20" r="7" fill="%s"/>' % col
                          else:
                              body += '<line x1="0" y1="0" x2="0" y2="40" stroke="%s" stroke-width="9"/>' % col
                              if style == "cross":
                                  body += '<line x1="0" y1="0" x2="40" y2="0" stroke="%s" stroke-width="9"/>' % col
                          return ('<pattern id="p_%s" width="40" height="40" patternUnits="userSpaceOnUse" '
                                  'patternTransform="rotate(%d)">%s</pattern>' % (name, rot, body))
                      defs = "".join(pattern(n, c, st) for k, n, c, st in LAYERS if st != "solid")
                      # pin names
                      labs = []
                      seen = set()
                      for lb in top.get_labels():
                          t = lb.text
                          if t in seen or t.upper() in ("VPWR", "VGND", "VPB", "VNB") or len(labs) >= 80:
                              continue
                          seen.add(t)
                          lx = (lb.origin[0] - ox) * S
                          ly = (oy - lb.origin[1]) * S
                          if 0 <= lx <= W and 0 <= ly <= H:
                              labs.append((t, int(lx), int(ly)))
                      fs = max(60, int(max(W, H) / 55))
                      tiers = [set(), {"prb"}, {"prb", "nwell", "tap"},
                               {"prb", "nwell", "tap", "diff", "poly", "licon", "li1", "mcon"}]
                      data = b""
                      for drop in tiers:
                          parts = ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 %d %d">' % (W, H),
                                   '<style>path,rect.d{vector-effect:non-scaling-stroke}'
                                   'text{font-family:monospace}</style>',
                                   '<defs>%s</defs>' % defs,
                                   '<rect width="%d" height="%d" fill="#000"/>' % (W, H)]
                          if "prb" not in drop and (235, 4) in by:
                              parts.append('<path fill="none" stroke="#6b7280" stroke-width="0.6" d="%s"/>'
                                           % "".join(path(pt) for pt in by[(235, 4)]))
                          for key, name, col, st in LAYERS:
                              if name in drop or key not in by:
                                  continue
                              d = "".join(path(pt) for pt in by[key])
                              if st == "solid":
                                  parts.append('<path fill="%s" fill-opacity="0.65" stroke="%s" '
                                               'stroke-width="0.8" d="%s"/>' % (col, col, d))
                              else:
                                  parts.append('<path fill="url(#p_%s)" stroke="%s" stroke-width="1" d="%s"/>'
                                               % (name, col, d))
                          parts.append('<rect class="d" x="%d" y="%d" width="%d" height="%d" fill="none" '
                                       'stroke="#9aa4b2" stroke-width="1" stroke-dasharray="8 5"/>'
                                       % (int(pad * S), int(pad * S), int((x1 - x0) * S), int((y1 - y0) * S)))
                          for t, lx, ly in labs:
                              parts.append('<text x="%d" y="%d" font-size="%d" fill="#ffffff">%s</text>'
                                           % (lx, ly, fs, t.replace("&", "").replace("<", "")))
                          parts.append("</svg>")
                          raw = "".join(parts).encode()
                          data = gzip.compress(raw, 9)
                          if len(data) <= 1200000 and len(raw) <= 8000000:
                              break
                      open("results/layout.svg.gz", "wb").write(data)
                      out.append("")
                      out.append("layout: %.1f x %.1f um die, svg %d KB" % (x1 - x0, y1 - y0, len(data) // 1024))
                  except Exception as e:
                      out.append("layout svg failed: %s" % e)
                  # 2) fallback picture, used only if the SVG is missing
                  if not os.path.exists("results/layout.svg.gz"):
                      try:
                          import gdstk, matplotlib
                          matplotlib.use("Agg")
                          import matplotlib.pyplot as plt
                          from matplotlib.collections import PolyCollection
                          lib = gdstk.read_gds(g[0])
                          polys = lib.top_level()[0].get_polygons()
                          by = {}
                          for p in polys:
                              by.setdefault(p.layer, []).append(p.points)
                          fig = plt.figure(figsize=(12, 12), dpi=200)
                          ax = fig.add_axes([0, 0, 1, 1])
                          cols = plt.cm.tab20.colors
                          for l, pts in by.items():
                              ax.add_collection(PolyCollection(pts, facecolor=cols[l % 20],
                                                               alpha=0.6, linewidths=0))
                          ax.autoscale()
                          ax.set_aspect("equal")
                          ax.axis("off")
                          for q in (88, 80, 70, 60, 50, 40, 30, 20):
                              b = io.BytesIO()
                              fig.savefig(b, format="jpg", pil_kwargs={"quality": q})
                              if b.tell() < 450000:
                                  break
                          open("results/layout.jpg", "wb").write(b.getvalue())
                      except Exception as e:
                          out.append("layout image failed: %s" % e)
          open("results/summary.md", "w").write("\n".join(out) + "\n")
          PY
          cat results/summary.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asic-run
          path: runs/*/final
      - name: commit results
        if: always()
        run: |
          git config user.name "asic-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A results
          git commit -m "asic results" || true
          git pull --rebase origin main || true
          git push || true